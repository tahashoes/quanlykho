# Đặt hai khối server này bên trong khối http của Nginx đang phục vụ tahashoes.vn.

server {
    listen 80;
    server_name tahashoes.one www.tahashoes.one;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tahashoes.one$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tahashoes.one www.tahashoes.one;

    ssl_certificate /etc/letsencrypt/live/tahashoes.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tahashoes.one/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://quanlykho:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
